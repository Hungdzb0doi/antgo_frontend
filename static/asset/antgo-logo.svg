<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="100%" height="100%">
  <defs>
    <linearGradient id="antgoLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#FF6600" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG KIẾN + TIA SÉT (Tọa độ tỉ lệ 64x64) -->
  <g transform="translate(4, 2) scale(0.6)" filter="url(#logoGlow)">
    <!-- Râu kiến -->
    <path d="M 64 25 C 68 18 73 14 78 13" fill="none" stroke="url(#antgoLogoGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 68 28 C 76 25 81 23 85 24" fill="none" stroke="url(#antgoLogoGrad)" stroke-width="4" stroke-linecap="round"/>

    <!-- Đầu kiến -->
    <path d="M 58 22 C 67 22 73 28 70 36 C 67 43 59 42 54 36 C 50 31 53 23 58 22 Z" fill="url(#antgoLogoGrad)"/>
    <path d="M 62 28 Q 65 31 63 33" stroke="#18181B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Chân kiến chuyển động -->
    <path d="M 50 38 L 44 26 L 38 28" fill="none" stroke="url(#antgoLogoGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 44 48 L 30 42 L 22 49" fill="none" stroke="url(#antgoLogoGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 38 60 L 26 66 L 20 78" fill="none" stroke="url(#antgoLogoGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Thân & Đuôi tạo thành tia sét siêu tốc -->
    <path d="M 54 34 L 38 52 L 49 52 L 32 84 L 58 56 L 47 56 L 60 38 Z" fill="url(#antgoLogoGrad)"/>
    <path d="M 28 58 C 22 62 18 69 22 75 C 24 78 28 77 31 74 L 32 70 Z" fill="url(#antgoLogoGrad)" opacity="0.9"/>
  </g>

  <!-- CHỮ THƯƠNG HIỆU: AntGo -->
  <g transform="translate(74, 43)">
    <!-- Chữ Ant (Trắng hoặc Đen than tùy theme, mặc định fill current hoặc #18181B / #FFFFFF) -->
    <text x="0" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          letter-spacing="-0.5px" 
          fill="currentColor">Ant</text>
    
    <!-- Chữ Go (Màu Cam tốc độ #FF6600) -->
    <text x="64" y="0" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="36" 
          font-weight="900" 
          letter-spacing="-0.5px" 
          fill="url(#antgoLogoGrad)">Go</text>

    <!-- Biểu tượng tia sét nhỏ viền năng lượng ở chữ O -->
    <path d="M 112 -19 L 105 -11 L 110 -11 L 103 -4 L 113 -12 L 108 -12 Z" fill="#FFB703"/>
  </g>
</svg>
